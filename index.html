<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GradeWise - AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; background: #08080b; }
      .login-shell { width: min(480px, 100%); }
      .login-brand { text-align: center; margin-bottom: 32px; }
      .login-brand .brand-mark { width: 48px; height: 48px; border-radius: 16px; background: linear-gradient(135deg, #7c3aed, #c084fc); display: grid; place-items: center; font-size: 26px; margin: 0 auto 12px; color: #fff; }
      .login-brand h1 { font: 800 28px 'Manrope', sans-serif; letter-spacing: -1px; margin: 0; color: #f5f3ff; }
      .login-brand h1 span { color: #a855f7; }
      .login-brand p { font-size: 13px; color: #aaa1b5; margin: 6px 0 0; }
      .card { border-radius: 22px; padding: 32px 28px; background: #111116; border: 1px solid #292532; }
      .role-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px; }
      .role-tab { padding: 10px; border-radius: 14px; border: 1px solid #292532; background: #0c0c11; font: 600 13px 'DM Sans', sans-serif; cursor: pointer; transition: all 0.15s; color: #aaa1b5; }
      .role-tab.active.teacher { background: #7c3aed; color: #fff; border-color: #7c3aed; }
      .role-tab.active.student { background: #5b21b6; color: #fff; border-color: #5b21b6; }
      .form-group { margin-bottom: 14px; }
      .form-group label { display: block; font-size: 11px; font-weight: 600; color: #a59bb5; margin-bottom: 6px; }
      .form-group input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid #3b2b50; font: 14px 'DM Sans', sans-serif; outline: none; background: #0c0c11; color: #f5f3ff; }
      .form-group input:focus { border-color: #7c3aed; background: #111116; }
      .name-group { display: none; }
      .name-group.visible { display: block; }
      .submit-btn { width: 100%; padding: 13px; border-radius: 30px; border: none; font: 600 14px 'DM Sans', sans-serif; cursor: pointer; margin-top: 6px; transition: opacity 0.15s; color: #fff; }
      .submit-btn:hover { opacity: 0.85; }
      .submit-btn.teacher { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
      .submit-btn.student { background: linear-gradient(135deg, #5b21b6, #7c3aed); }
      .toggle-mode { text-align: center; margin-top: 16px; font-size: 12px; color: #aaa1b5; }
      .toggle-mode a { color: #a855f7; cursor: pointer; font-weight: 600; text-decoration: none; }
      .error-msg { color: #f87171; font-size: 12px; margin-top: 12px; min-height: 18px; text-align: center; }
      .success-msg { color: #a855f7; font-size: 12px; margin-top: 12px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <div class="login-brand">
        <div class="brand-mark">✦</div>
        <h1>GradeWise<span> - AI</span></h1>
        <p>Intelligent assessment workspace</p>
      </div>

      <div class="card">
        <div class="role-tabs">
          <button class="role-tab teacher active" onclick="setRole('teacher')">🎓 Teacher</button>
          <button class="role-tab student" onclick="setRole('student')">📚 Student</button>
        </div>

        <div class="form-group name-group" id="name-group">
          <label>Full Name</label>
          <input type="text" id="full-name" placeholder="Your full name" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" />
        </div>

        <button class="submit-btn teacher" id="submit-btn" onclick="submit()">Login as Teacher</button>
        <div class="error-msg" id="error-msg"></div>
        <div class="success-msg" id="success-msg"></div>

        <div class="toggle-mode">
          <span id="toggle-text">Don't have an account?</span>
          <a onclick="toggleMode()"> <span id="toggle-link">Sign up</span></a>
        </div>
      </div>
    </div>

    <script>
      let role = 'teacher';
      let isSignup = false;

      function setRole(r) {
        role = r;
        document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
        document.querySelector('.role-tab.' + r).classList.add('active');
        document.getElementById('submit-btn').className = 'submit-btn ' + r;
        updateLabels();
        clearMessages();
      }

      function toggleMode() {
        isSignup = !isSignup;
        document.getElementById('name-group').classList.toggle('visible', isSignup);
        document.getElementById('toggle-text').textContent = isSignup ? 'Already have an account?' : "Don't have an account?";
        document.getElementById('toggle-link').textContent = isSignup ? 'Login' : 'Sign up';
        updateLabels();
        clearMessages();
      }

      function updateLabels() {
        const action = isSignup ? 'Sign up' : 'Login';
        const r = role.charAt(0).toUpperCase() + role.slice(1);
        document.getElementById('submit-btn').textContent = action + ' as ' + r;
      }

      function clearMessages() {
        document.getElementById('error-msg').textContent = '';
        document.getElementById('success-msg').textContent = '';
      }

      async function submit() {
        clearMessages();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const fullName = document.getElementById('full-name').value.trim();

        if (!email || !password) { document.getElementById('error-msg').textContent = 'Enter your email and password.'; return; }
        if (isSignup && !fullName) { document.getElementById('error-msg').textContent = 'Enter your full name.'; return; }

        const endpoint = isSignup ? '/api/auth/signup' : '/api/auth/login';
        const body = isSignup
          ? { role, email, password, full_name: fullName }
          : { role, email, password };

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          if (!res.ok) { document.getElementById('error-msg').textContent = data.error || 'Something went wrong.'; return; }
          if (isSignup && !data.authenticated) {
            document.getElementById('success-msg').textContent = 'Account created! Check your email to confirm, then log in.';
            return;
          }
          window.location.href = data.redirect_url;
        } catch {
          document.getElementById('error-msg').textContent = 'Could not connect to server.';
        }
      }

      document.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    </script>
  </body>
</html>
